name: Quality checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10.2"
      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
      - name: Verify document conversion tools
        run: pandoc --version && tectonic --version
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Lint refactored Python modules
        run: >-
          ruff check app/prd app/services app/workflow_orchestration
          app/application_types.py app/errors.py app/observability.py
      - name: Check formatting of refactored Python modules
        run: >-
          ruff format --check app/prd app/services app/workflow_orchestration
          app/application_types.py app/errors.py app/observability.py
      - name: Type-check application boundaries
        run: >-
          mypy app/prd app/application_types.py app/errors.py app/observability.py
      - name: Check database schema drift
        run: python check_schema_drift.py
      - name: Run tests with branch coverage
        run: python -m pytest --cov=app --cov-branch --cov-fail-under=75 -q
      - name: Enforce canonical PRD package coverage
        run: >-
          python -m pytest tests/test_prd_renderers.py
          --cov=app.prd --cov-branch --cov-fail-under=80 -q
