name: Quality checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10.2"
      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
      - name: Verify document conversion tools
        run: pandoc --version && tectonic --version
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Check database schema drift
        run: python check_schema_drift.py
      - name: Run tests with branch coverage
        run: python -m pytest --cov=app --cov-branch --cov-fail-under=75 -q
